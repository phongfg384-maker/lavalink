server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    # Plugin YouTube được cộng đồng lavalink-devs duy trì, thay cho source cũ đã bị deprecated.
    # Version hiện tại (theo trang Releases bạn vừa check): 1.18.2
    # Nếu về sau có bản mới hơn, xem tại: https://github.com/lavalink-devs/youtube-source/releases
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "meowbotxyz"
    sources:
      youtube: false   # BẮT BUỘC tắt source cũ, vì plugin ở trên sẽ đảm nhiệm thay thế
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    playerUpdateInterval: 5

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    oauth:
      enabled: true
      # Sau khi deploy, xem Deploy Logs — plugin sẽ in ra 1 link + mã pairing (dạng
      # https://www.google.com/device và 1 mã code). Mở link đó trên điện thoại/máy tính,
      # đăng nhập bằng 1 tài khoản Google (nên dùng acc phụ, không dùng acc chính) rồi nhập mã.
      # Sau khi xác thực xong, log sẽ in ra "refreshToken": "....". Copy giá trị đó dán vào
      # dòng dưới để lần deploy sau khỏi phải đăng nhập lại (vì container Railway build lại
      # từ đầu mỗi lần push, không tự nhớ được).
      # refreshToken: ""

logging:
  level:
    root: INFO
    lavalink: INFO
